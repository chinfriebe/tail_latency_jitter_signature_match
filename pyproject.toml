[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chinfriebe-lorapeft_jd378"
version = "0.1.0"
description = "通过字符级与结构级特征识别LoRA 与参数高效微调研究员·尾延迟抖动与首 token 时间的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "chinfriebe" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://chinfriebe.github.io"
Repository = "https://github.com/chinfriebe/lorapeft_jd378"
Issues = "https://github.com/chinfriebe/lorapeft_jd378/issues"

[project.scripts]
lorapeft_jd378 = "lorapeft_jd378:main"

[tool.setuptools]
py-modules = ["lorapeft_jd378"]
